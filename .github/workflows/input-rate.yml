name: Input scan rates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  input-rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The input scan at 10000, 5000, 2000 and 1000 ticks a second (FM1_INPUT_HZ)
        env:
          CC: clang
        run: tests/run_input_rate_test.sh
